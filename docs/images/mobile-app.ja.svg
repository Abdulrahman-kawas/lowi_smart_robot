<text x="690" y="152" font-size="19" fill="#e8edf3" font-weight="700">動作の仕組み（予定）</text>
<circle cx="704" cy="193" r="13" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/>
<text x="704" y="198" font-size="13" fill="#ffb547" font-weight="700" text-anchor="middle">1</text>
<text x="728" y="198" font-size="15" fill="#d5dce6">ロボットのカメラ映像をライブ表示</text>
<circle cx="704" cy="241" r="13" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/>
<text x="704" y="246" font-size="13" fill="#ffb547" font-weight="700" text-anchor="middle">2</text>
<text x="728" y="246" font-size="15" fill="#d5dce6">ジョイスティックは1秒ずつの移動を送信、押す間は継続</text>
<circle cx="704" cy="289" r="13" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/>
<text x="704" y="294" font-size="13" fill="#ffb547" font-weight="700" text-anchor="middle">3</text>
<text x="728" y="294" font-size="15" fill="#d5dce6">Tailscale経由でブレインへ。ロボットへ直接は送らない</text>
<circle cx="704" cy="337" r="13" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/>
<text x="704" y="342" font-size="13" fill="#ffb547" font-weight="700" text-anchor="middle">4</text>
<text x="728" y="342" font-size="15" fill="#d5dce6">停止が最優先：停止 &gt; 音声 &gt; 遠隔 &gt; プランナー</text>
<circle cx="704" cy="385" r="13" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/>
<text x="704" y="390" font-size="13" fill="#ffb547" font-weight="700" text-anchor="middle">5</text>
<text x="728" y="390" font-size="15" fill="#d5dce6">遠隔操作は低速・短い移動に制限</text>
<circle cx="704" cy="433" r="13" fill="#ffb547" fill-opacity=".14" stroke="#ffb547" stroke-opacity=".7"/>
<text x="704" y="438" font-size="13" fill="#ffb547" font-weight="700" text-anchor="middle">6</text>
<text x="728" y="438" font-size="15" fill="#d5dce6">非常停止の解除には新しい写真と確認が必要</text>
<text x="48" y="494" font-size="12.5" fill="#5b6676" font-weight="700" letter-spacing="2">ジョイスティック操作の流れ</text>
