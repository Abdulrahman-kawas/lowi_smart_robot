<title id="title">Telegram and WhatsApp</title>
<desc id="desc">Two animated phone chats, Telegram for control and WhatsApp for conversation, both connected to the home server and then the robot.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
