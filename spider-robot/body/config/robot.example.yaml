# Spider robot body configuration (Raspberry Pi 4). Copy to robot.yaml and edit.
robot_id: spider-01

mqtt:                      # the Mosquitto broker on this Pi, so control works with no network
  host: 127.0.0.1
  port: 1883               # loopback listener: needs no certificate and no correct clock
  tls: false
  username: spider-01
  password_file: /etc/spider/secrets/spider-01.mqtt
  reconnect_max_s: 2

# Survives crashes and reboots. Remove only by releasing the E-stop.
estop_latch_path: /var/lib/spider/estop.latch

rt:
  enabled: true
  cpu: 0                   # must match CPUAffinity in spider-body.service
  priority: 50
  lock_memory: true

sysmon:
  username: spider-sysmon
  password_file: /etc/spider/secrets/spider-sysmon.mqtt
  server_tailscale_name: ""  # the server's Tailscale machine name, to report direct or relay

recorder:
  endpoint: ipc:///tmp/spider_lidar_rec.ipc
  out_dir: /var/lib/spider/rec
  username: spider-recorder
  password_file: /etc/spider/secrets/spider-recorder.mqtt

safety:
  link_timeout_s: 1.5
  max_cmd_age_s: 1.0       # needs NTP (chrony) on the Pi and the brain host
  require_lidar: true      # false ONLY with the robot on a stand
  lidar_timeout_s: 0.5
  imu_timeout_s: 0.3
  # distances below are measured from the footprint edge (leg tips), not the LiDAR
  stop_distance_m: 0.15
  slow_distance_m: 0.40
  corridor_margin_m: 0.04
  turn_clearance_m: 0.06
  max_level_deg: 2.0
  max_tilt_deg: 30
  fall_tilt_deg: 55

lidar:
  enabled: true
  endpoint: ipc:///tmp/spider_lidar.ipc
  mount_height_m: 0.15     # LiDAR optical centre above the ground when standing
  mount_yaw_deg: 0         # if the L2 cable points backwards, 0 is usually right; verify!
  imu_upside_down: false   # true if the L2 hangs upside down (status shows roll ~180 at rest)
  z_min_m: 0.04
  z_max_m: 0.45
  max_range_m: 8.0
  sectors: 36
  history_clouds: 3        # nearest return per sector over this many clouds; one cloud can miss
  # The beams that hit the front camera (deg, robot frame), measured on the robot with
  # infra/pi/lidar_near_points.py. Without it the camera reads as an obstacle right in front.
  # camera_window: {bearing_min_deg: -30, bearing_max_deg: 30, elevation_min_deg: 6,
  #                 elevation_max_deg: 42, max_range_m: 0.6}

camera:
  external: true           # answered by spider-camera on cores 1-3, never by the control loop
  username: spider-camera
  password_file: /etc/spider/secrets/spider-camera.mqtt
  backend: opencv          # opencv (USB webcam) | picamera2 (Pi camera) | none
  device: 0
  width: 640
  height: 480
  jpeg_quality: 80
  max_bytes: 120000


# Servo controller: Lynxmotion SSC-32U on USB (chosen). Right legs on VS1 (channels 0-15),
# left legs and the camera (27) on VS2 (channels 16-31); two UBECs at 6.0 V, VS1=VS2 jumpers REMOVED.
servo_driver: ssc32u
ssc:
  port: /dev/ttyUSB0       # better: the /dev/serial/by-id/usb-FTDI_... path (ls /dev/serial/by-id/)
  baud: 115200             # set the SSC-32U to 115200 with its baud button (factory default 9600)
  update_hz: 25

# DSSERVO RDS3218: 500-2500 us = 270 deg. Logical servo degrees: 90 = centre pulse (1500 us).
pulse:
  min_us: 500
  max_us: 2500
  range_deg: 270

# Alternative controller (not used): servo_driver: pca9685, boards 0x40/0x41, channels 0-15
pca:
  i2c_bus: 1
  addresses: [0x40, 0x41]
  freq_hz: 50
  osc_hz: 25000000

# Measure YOUR robot (metres): joint axis to joint axis.
geometry:
  coxa_m: 0.045
  femur_m: 0.075
  tibia_m: 0.130
  stance_radius_m: 0.12
  body_height_m: 0.09
  sit_height_m: 0.035
  footprint_x_m: 0.24      # half-length incl. legs (top view); LiDAR ignores points inside
  footprint_y_m: 0.27      # half-width incl. legs; obstacle distances are from this box edge

gait:
  period_s: 1.0
  step_height_m: 0.035
  max_stride_m: 0.07
  max_vx: 0.12
  max_vy: 0.08
  max_wz: 0.6
  accel: 0.25
  yaw_accel: 1.5
  control_hz: 50
  posture_speed_mps: 0.04

state_hz: 4

# Front camera pan servo (10 kg, 180 degrees) on channel 27 (VS2). Look turns it: 0 = straight
# ahead, + = left. Only after the bench check (500-2500 us = 180 deg) and
# `spider-calibrate center|direction|trim --camera`. Delete this block to leave channel 27 alone.
camera_pan:
  channel: 27
  pulse: {min_us: 500, max_us: 2500, range_deg: 180}
  min_deg: 30              # servo degrees: +-60 deg of pan; widen only after looking at the legs
  max_deg: 150
  max_rate_dps: 90         # glide rate at Look speed 1.0

# Leg mounts (body frame: x forward, y left). SSC-32U channels as the owner wired them on 2026-11-19
# (fixed: change the wiring, not these numbers). Coxa at the body, tibia at the tip. LM counts down
# (22, 21, 20) and LR skips 17 (19, 18, 16). Channel 27 turns the camera (camera_pan
# above). Free: 0, 4, 8-12, 17, 23-26, 28.
# direction/trim come from calibration.yaml (spider-calibrate).
legs:
  - name: LF
    mount_x: 0.1
    mount_y: 0.06
    mount_angle_deg: 45
    coxa:  {channel: 29}
    femur: {channel: 30}
    tibia: {channel: 31}
  - name: LM
    mount_x: 0.0
    mount_y: 0.08
    mount_angle_deg: 90
    coxa:  {channel: 22}
    femur: {channel: 21}
    tibia: {channel: 20}
  - name: LR
    mount_x: -0.1
    mount_y: 0.06
    mount_angle_deg: 135
    coxa:  {channel: 19}
    femur: {channel: 18}
    # A 180-degree servo for now, until a 35 kg 270-degree one replaces it: its own pulse range.
    # Check 500-2500 us = 180 deg on the bench before the first move.
    tibia: {channel: 16, pulse: {min_us: 500, max_us: 2500, range_deg: 180}}
  - name: RF
    mount_x: 0.1
    mount_y: -0.06
    mount_angle_deg: -45
    coxa:  {channel: 13}
    femur: {channel: 14}
    tibia: {channel: 15}
  - name: RM
    mount_x: 0.0
    mount_y: -0.08
    mount_angle_deg: -90
    coxa:  {channel: 5}
    femur: {channel: 6}
    tibia: {channel: 7}
  - name: RR
    mount_x: -0.1
    mount_y: -0.06
    mount_angle_deg: -135
    coxa:  {channel: 1}
    femur: {channel: 2}
    tibia: {channel: 3}

# moves:                    # expressive moves (moves.py); the defaults are shown
#   table_height_m: 0.17    # the table pose: body height, ground to coxa joints (0.10-0.19)
#   table_in_m: 0.03        # how far each foot first steps in toward the body (0-0.05)
