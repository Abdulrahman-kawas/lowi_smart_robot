[project]
name = "spider-body"
version = "0.1.0"
description = "Spider robot body: servos, gait, LiDAR safety reflexes and cloud link. Runs on a Raspberry Pi 4."
requires-python = ">=3.11"
dependencies = [
    "spider-common",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyzmq>=26.0",
    "opencv-python-headless>=4.9",
    "pyserial>=3.5",  # SSC-32U servo controller over USB
    "smbus2>=0.5",  # pure Python I2C for the PCA9685 alternative
]

[project.optional-dependencies]
# Hardware watchdog pin. Linux only, so development machines skip it.
gpio = ["gpiod>=2.2; sys_platform == 'linux'"]

[project.scripts]
spider-body = "spider_body.main:main"
spider-calibrate = "spider_body.calibrate:main"
spider-camera = "spider_body.camera_service:main"
spider-recorder = "spider_body.recorder:main"
spider-sysmon = "spider_body.sysmon:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.uv.sources]
spider-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
