[project]
name = "spider-gateway"
version = "0.1.0"
description = "Command gateway on the Raspberry Pi: the only sender of commands to the spider robot body."
requires-python = ">=3.11"
dependencies = [
    "spider-common",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The physical E-stop release button. Linux only, so development machines skip it.
gpio = ["gpiod>=2.2; sys_platform == 'linux'"]

[project.scripts]
spider-gateway = "spider_gateway.main:main"
spider-robotctl = "spider_gateway.console:main"
spider-button = "spider_gateway.button:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "spider-body"]

[tool.uv.sources]
spider-common = { path = "../common", editable = true }
spider-body = { path = "../body", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
