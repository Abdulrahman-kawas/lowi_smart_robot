# The broker on the Pi. /etc/mosquitto/conf.d/spider.conf (see infra/pi/setup_pi.sh)
#   127.0.0.1:1883  processes on the Pi, by username and password. No certificate and no clock
#                   dependence, so a Pi that boots with no network or a wrong clock still works.
# The Tailscale listener for the brain is in mosquitto-tls.conf, installed only once its
# certificates exist. A missing certificate file would stop the whole broker, loopback included.
set_tcp_nodelay true   # no Nagle delay on small control messages (43 ms -> 2 ms)
persistence false      # a command must never survive a broker restart
allow_anonymous false
password_file /etc/mosquitto/spider/passwords
acl_file /etc/mosquitto/spider/acl
max_queued_messages 100
max_inflight_messages 20
message_size_limit 524288
connection_messages false
log_type error
log_type warning

listener 1883 127.0.0.1
