[project]
name = "spider-brain"
version = "0.1.0"
description = "Spider robot brain: LangGraph planner (Claude or Liquid LFM2.5), Liquid vision, supervised tool execution."
requires-python = ">=3.11"
dependencies = [
    "spider-common",
    "anthropic>=0.69.0",
    "langgraph>=0.2.60",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
spider-brain = "spider_brain.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "spider-body",  # end-to-end tests drive the simulated body in-process
]

[tool.uv.sources]
spider-common = { path = "../common", editable = true }
spider-body = { path = "../body", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
