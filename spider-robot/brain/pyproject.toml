[project]
name = "spider-brain"
version = "0.1.0"
description = "Spider robot brain: LangGraph planner (Claude or Liquid LFM2.5), Liquid vision, supervised tool execution."
requires-python = ">=3.11"
dependencies = [
    "spider-common",
    "anthropic>=0.69.0",
    "langgraph>=0.2.60",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
# Voice notes (same libraries as the repo's orchestrator.py); ffmpeg comes from apt.
voice = ["google-genai>=1.0", "gTTS>=2.5"]
# Converts a recording to a ROS 1 bag for the SLAM container. Only on the home server.
slam = ["rosbags>=0.11", "numpy>=1.26"]

[project.scripts]
spider-brain = "spider_brain.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "spider-body",  # end-to-end tests drive the simulated body in-process
    "spider-gateway",  # gateway-mode tests run the real arbitration in-process
]
# Only on the home server: uv sync --extra voice --extra slam --group stt --group aws
stt = ["faster-whisper==1.2.1", "ctranslate2==4.8.5"]
aws = ["boto3>=1.35,<2"]

[tool.uv.sources]
spider-common = { path = "../common", editable = true }
spider-body = { path = "../body", editable = true }
spider-gateway = { path = "../gateway", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
