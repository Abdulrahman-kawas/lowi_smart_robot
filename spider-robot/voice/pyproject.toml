[project]
name = "spider-voice"
version = "0.1.0"
description = "Voice loop on the Raspberry Pi: VAD, Whisper, stop words, router, Piper."
requires-python = ">=3.11"
dependencies = [
    "spider-common",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Pinned because these decide latency and Arabic quality; never float them on the robot.
pi = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.5",
    "piper-tts==1.8.0",
    "webrtcvad-wheels==2.0.14.post1",
]

[project.scripts]
spider-voice = "spider_voice.main:main"
spider-voice-bench = "spider_voice.bench:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "spider-body", "spider-gateway"]

[tool.uv.sources]
spider-common = { path = "../common", editable = true }
spider-body = { path = "../body", editable = true }
spider-gateway = { path = "../gateway", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider_voice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
