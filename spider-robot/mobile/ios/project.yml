# XcodeGen project for the Lowi app. Generate with `xcodegen generate` in this folder; the
# .xcodeproj it writes is git-ignored. One universal target for iPhone and iPad, iOS 17 or newer.
name: Lowi
options:
  bundleIdPrefix: app.lowi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""  # set your team to run on a device
    CODE_SIGN_STYLE: Automatic
targets:
  Lowi:
    type: application
    platform: iOS
    sources:
      - path: Lowi
    info:
      path: Lowi/Info.plist  # generated by XcodeGen from the properties below
      properties:
        CFBundleDisplayName: Lowi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Lowi records your voice only while you hold the Talk button, and sends it to your robot's brain so the robot can answer you."
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The brain is reached over HTTPS through `tailscale serve`. Plain HTTP only to the
        # simulator stack on this Mac (127.0.0.1).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lowi.Lowi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  LowiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LowiTests
    dependencies:
      - target: Lowi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lowi.LowiTests
  LowiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LowiUITests
    dependencies:
      - target: Lowi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lowi.LowiUITests
        TEST_TARGET_NAME: Lowi
schemes:
  Lowi:
    build:
      targets:
        Lowi: all
    test:
      targets:
        - LowiTests
        - LowiUITests
      gatherCoverageData: false
